<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Página para buscar informações de CNPJ.">
    <meta name="keywords" content="CNPJ, busca, empresa, informações">
    <meta name="author" content="Arlan Oliveira">
    <link rel="stylesheet" href="style.css">
    <title>Comprovante de Inscrição e Situação Cadastral</title>
</head>

<body>

    <header>
        <div class="topo-sistema">
            <img src="assets/Img/LOGO_REDE_SIM.png" alt="Logo Redesim">
            <p>COMPROVANTE DE INSCRIÇÃO E DE SITUAÇÃO CADASTRAL</p>
        </div>


    </header>

    <main>
        <form>

            <!-- Dados Cadastrais -->
            <section aria-labelledby="dados-cadastrais">
                <div class="cabecalho-documento">
                    <img src="assets/Img/BRASAO 1.png" alt="Brasão da República Federativa do Brasil">
                    <div>
                        <h1>República Federativa do Brasil</h1>
                        <h2>Cadastro Nacional da Pessoa Jurídica</h2>
                    </div>
                </div>
                <h3 id="dados-cadastrais">Dados Cadastrais</h3>

                <fieldset>
                    <legend>Identificação</legend>

                    <div class="identificacao">
                        <div class="cnpj-input">
                            <label for="cnpj">CNPJ</label>
                            <input type="text" id="cnpj" name="cnpj" placeholder="Digite o CNPJ"
                                onblur="getCNPJData(this.value)">
                        </div>

                        <div>
                            <label for="data-abertura">Data de Abertura</label>
                            <input type="text" id="data-abertura" name="data-abertura" readonly>
                        </div>

                        <div>
                            <label for="porte">Porte</label>
                            <input type="text" id="porte" name="porte" readonly>
                        </div>
                    </div>
                    <div class="nome-empresa">
                        <label for="nome-empresarial">Nome Empresarial</label>
                        <input type="text" id="nome-empresarial" name="nome-empresarial" readonly>
                    </div>

                    <div class="nome-empresa">
                        <label for="nome-fantasia">Nome Fantasia</label>
                        <input type="text" id="nome-fantasia" name="nome-fantasia" readonly>
                    </div>

                    <div class="textArea">
                        <label for="cnae">CNAE</label>
                        <textarea type="text" id="cnae" name="cnae" readonly></textarea>
                    </div>

                    <div class="cnae-apura">
                        <div class="cod-natureza">
                            <label for="natureza-juridica">Código Natureza Jurídica</label>
                            <input type="text" id="natureza-juridica" name="natureza-juridica" readonly>
                        </div>

                        <div>
                            <label for="regime-apuracao">Regime de Apuração</label>
                            <input type="text" id="regime-apuracao" name="regime-apuracao" readonly>
                        </div>

                    </div>


                </fieldset>
            </section>

            <!-- Endereço -->
            <section aria-labelledby="endereco">
                <h3 id="endereco">Endereço</h3>

                <fieldset>
                    <legend>Localização</legend>
                    <div class="end-completo">
                        <div>
                            <label for="logradouro">Logradouro</label>
                            <input type="text" id="logradouro" name="logradouro" readonly>
                        </div>

                        <div>
                            <label for="numero">Número</label>
                            <input type="text" id="numero" name="numero" readonly>
                        </div>

                        <div>
                            <label for="complemento">Complemento</label>
                            <input type="text" id="complemento" name="complemento" readonly>
                        </div>
                    </div>
                    <div class="end-adicionais">
                        <div>
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" readonly>
                        </div>

                        <div>
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" name="bairro" readonly>
                        </div>

                        <div>
                            <label for="municipio">Município</label>
                            <input type="text" id="municipio" name="municipio" readonly>
                        </div>

                        <div>
                            <label for="uf">UF</label>
                            <input type="text" id="uf" name="uf" maxlength="2" readonly>
                        </div>
                    </div>
                </fieldset>
            </section>

            <!-- Situação Cadastral -->
            <section aria-labelledby="situacao-cadastral">
                <h3 id="situacao-cadastral">Situação Cadastral</h3>

                <fieldset>
                    <legend>Status</legend>
                    <div class="sit-cad">
                        <div>
                            <label for="ente-responsavel">Ente Federativo Responsável</label>
                            <input type="text" id="ente-responsavel" name="ente-responsavel" readonly>
                        </div>

                        <div>
                            <label for="situacao">Situação Cadastral</label>
                            <input type="text" id="situacao" name="situacao" readonly>
                        </div>

                        <div>
                            <label for="data-situacao">Data da Situação Cadastral</label>
                            <input type="text" id="data-situacao" name="data-situacao" readonly>
                        </div>
                    </div>
                    <div class="motivo-sit-cad">
                        <label for="motivo-situacao">Motivo de Situação Cadastral</label>
                        <input type="text" id="motivo-situacao" name="motivo-situacao" readonly>
                    </div>
                    <div class="sit-cad">
                        <div>
                            <label for="situacao-especial">Situação Especial</label>
                            <input type="text" id="situacao-especial" name="situacao-especial" readonly>
                        </div>

                        <div>
                            <label for="data-situacao-especial">Data da Situação Especial</label>
                            <input type="text" id="data-situacao-especial" name="data-situacao-especial" readonly>
                        </div>
                    </div>
                </fieldset>
            </section>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Receita Federal do Brasil - Desenvolvido por Arlan de Oliveira</p>
    </footer>
    <script src="apiService.js"></script>

</body>

</html>
